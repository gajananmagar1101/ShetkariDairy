<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#4F46E5"/>
  <!-- Open vahi/notebook -->
  <rect x="110" y="130" width="200" height="280" rx="6" fill="white" opacity="0.95"/>
  <!-- Red margin line (classic vahi) -->
  <line x1="150" y1="130" x2="150" y2="410" stroke="#EF4444" stroke-width="2" opacity="0.5"/>
  <!-- Ruled lines -->
  <line x1="130" y1="185" x2="290" y2="185" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="130" y1="220" x2="290" y2="220" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="130" y1="255" x2="290" y2="255" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="130" y1="290" x2="290" y2="290" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="130" y1="325" x2="290" y2="325" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="130" y1="360" x2="290" y2="360" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Written text/numbers (hishob) -->
  <text x="165" y="212" font-family="system-ui" font-size="18" fill="#334155" opacity="0.8">दूध  5 लि.</text>
  <text x="165" y="247" font-family="system-ui" font-size="18" fill="#334155" opacity="0.8">₹ 250</text>
  <text x="165" y="282" font-family="system-ui" font-size="18" fill="#334155" opacity="0.7">दूध  3 लि.</text>
  <text x="165" y="317" font-family="system-ui" font-size="18" fill="#334155" opacity="0.5">₹ 150</text>
  <!-- Pen diagonal — writing position -->
  <rect x="295" y="200" width="14" height="180" rx="4" fill="#F59E0B" transform="rotate(-35 302 290)"/>
  <!-- Pen tip -->
  <polygon points="248,358 254,378 260,358" fill="#1E293B" transform="rotate(-35 254 368)"/>
  <!-- Pen top cap -->
  <rect x="295" y="190" width="14" height="25" rx="7" fill="#92400E" transform="rotate(-35 302 202)"/>
</svg>
