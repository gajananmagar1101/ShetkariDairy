<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="neon48">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonStrong48">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#030712"/>
  <!-- Neon outline vahi -->
  <rect x="130" y="110" width="210" height="300" rx="12" fill="none" stroke="#818CF8" stroke-width="4" filter="url(#neon48)"/>
  <!-- Neon binding -->
  <rect x="130" y="110" width="25" height="300" rx="8" fill="none" stroke="#F87171" stroke-width="3" filter="url(#neon48)"/>
  <!-- Neon lines -->
  <line x1="175" y1="180" x2="315" y2="180" stroke="#6366F1" stroke-width="2" filter="url(#neon48)" opacity="0.6"/>
  <line x1="175" y1="220" x2="315" y2="220" stroke="#6366F1" stroke-width="2" filter="url(#neon48)" opacity="0.6"/>
  <line x1="175" y1="260" x2="315" y2="260" stroke="#6366F1" stroke-width="2" filter="url(#neon48)" opacity="0.6"/>
  <line x1="175" y1="300" x2="315" y2="300" stroke="#6366F1" stroke-width="2" filter="url(#neon48)" opacity="0.6"/>
  <line x1="175" y1="340" x2="315" y2="340" stroke="#6366F1" stroke-width="2" filter="url(#neon48)" opacity="0.6"/>
  <!-- Neon written numbers -->
  <text x="190" y="215" font-family="system-ui" font-size="20" fill="#A5B4FC" font-weight="700" filter="url(#neon48)">₹ 450</text>
  <text x="190" y="255" font-family="system-ui" font-size="20" fill="#A5B4FC" font-weight="700" filter="url(#neon48)" opacity="0.8">₹ 320</text>
  <text x="190" y="295" font-family="system-ui" font-size="20" fill="#A5B4FC" font-weight="700" filter="url(#neon48)" opacity="0.6">₹ 180</text>
  <!-- Neon pen — bright glow -->
  <line x1="360" y1="90" x2="290" y2="340" stroke="#FBBF24" stroke-width="10" stroke-linecap="round" filter="url(#neonStrong48)"/>
  <!-- Pen tip glow -->
  <circle cx="290" cy="340" r="8" fill="#FBBF24" filter="url(#neonStrong48)"/>
  <!-- Writing sparks at tip -->
  <circle cx="285" cy="345" r="3" fill="white"/>
  <circle cx="295" cy="350" r="2" fill="#FBBF24" opacity="0.8"/>
  <circle cx="282" cy="338" r="2" fill="white" opacity="0.6"/>
</svg>
