<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg46" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="glass46" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur46">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="dshadow46">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg46)"/>
  <!-- Background blobs -->
  <circle cx="150" cy="150" r="80" fill="#A78BFA" opacity="0.3" filter="url(#blur46)"/>
  <circle cx="380" cy="380" r="90" fill="#6366F1" opacity="0.3" filter="url(#blur46)"/>
  <!-- Glassmorphism vahi card -->
  <rect x="110" y="120" width="240" height="310" rx="20" fill="url(#glass46)" stroke="white" stroke-opacity="0.2" stroke-width="2" filter="url(#dshadow46)"/>
  <!-- Inner page feel -->
  <rect x="125" y="135" width="210" height="280" rx="12" fill="white" opacity="0.08"/>
  <!-- Binding strip -->
  <rect x="110" y="120" width="22" height="310" rx="10" fill="#DC2626" opacity="0.7"/>
  <!-- Horizontal lines — glass feel -->
  <line x1="150" y1="195" x2="325" y2="195" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <line x1="150" y1="235" x2="325" y2="235" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <line x1="150" y1="275" x2="325" y2="275" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <line x1="150" y1="315" x2="325" y2="315" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <line x1="150" y1="355" x2="325" y2="355" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <!-- Written entries — white glow -->
  <text x="155" y="225" font-family="system-ui" font-size="18" fill="white" font-weight="600" opacity="0.9">दूध ५ लि.   ₹250</text>
  <text x="155" y="265" font-family="system-ui" font-size="18" fill="white" font-weight="600" opacity="0.7">दूध ३ लि.   ₹150</text>
  <text x="155" y="305" font-family="system-ui" font-size="18" fill="white" font-weight="600" opacity="0.5">दूध ४ लि.   ₹200</text>
  <!-- Golden pen — floating above with shadow -->
  <g transform="rotate(-50 390 200)">
    <rect x="370" y="90" width="14" height="250" rx="7" fill="#FBBF24" filter="url(#dshadow46)"/>
    <rect x="370" y="90" width="14" height="60" rx="7" fill="#92400E"/>
    <rect x="370" y="300" width="14" height="35" rx="3" fill="#374151"/>
    <path d="M377 335 L372 360 L377 365 L382 360 Z" fill="#D4AF37"/>
    <!-- Pen shine -->
    <rect x="373" y="160" width="3" height="80" rx="2" fill="white" opacity="0.4"/>
  </g>
  <!-- Sparkles -->
  <circle cx="170" cy="160" r="3" fill="white" opacity="0.8"/>
  <circle cx="320" cy="390" r="2" fill="white" opacity="0.6"/>
  <circle cx="340" cy="150" r="2.5" fill="white" opacity="0.7"/>
</svg>
