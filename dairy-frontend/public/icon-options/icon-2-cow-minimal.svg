<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="#4F46E5"/>
  <!-- Minimal cow face -->
  <g fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head oval -->
    <ellipse cx="256" cy="280" rx="90" ry="100"/>
    <!-- Ears -->
    <path d="M175 220 C160 180 140 170 135 190"/>
    <path d="M337 220 C352 180 372 170 377 190"/>
    <!-- Horns -->
    <path d="M190 195 C185 155 175 130 160 120"/>
    <path d="M322 195 C327 155 337 130 352 120"/>
    <!-- Eyes -->
    <circle cx="225" cy="265" r="8" fill="white" stroke="none"/>
    <circle cx="287" cy="265" r="8" fill="white" stroke="none"/>
    <!-- Nostrils -->
    <circle cx="240" cy="320" r="6" fill="white" stroke="none"/>
    <circle cx="272" cy="320" r="6" fill="white" stroke="none"/>
  </g>
</svg>
