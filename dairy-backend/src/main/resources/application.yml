spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: dairy-backend
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:${MONGODB_URI:${DATABASE_URL:mongodb+srv://gajananmagar004_db_user:OJgp4EnQLg7tsvYa@cluster0.eobdyd7.mongodb.net/dairy_db?appName=Cluster0}}}

server:
  port: ${PORT:8080}

app:
  mongo:
    connect-timeout-ms: ${MONGO_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${MONGO_READ_TIMEOUT_MS:10000}
    server-selection-timeout-ms: ${MONGO_SERVER_SELECTION_TIMEOUT_MS:5000}
