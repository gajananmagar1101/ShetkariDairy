<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg45" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="page45" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8F0"/>
    </linearGradient>
    <linearGradient id="pen45" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="shadow45">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow45">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg45)"/>
  <!-- Ambient glow -->
  <ellipse cx="256" cy="420" rx="120" ry="20" fill="#6366F1" opacity="0.2"/>
  <!-- 3D Vahi — back page (shadow) -->
  <rect x="128" y="118" width="220" height="300" rx="10" fill="#1E293B" opacity="0.5" transform="rotate(-2 238 268)"/>
  <!-- 3D Vahi — main page with shadow -->
  <rect x="120" y="110" width="220" height="300" rx="10" fill="url(#page45)" filter="url(#shadow45)"/>
  <!-- Maroon leather binding -->
  <rect x="120" y="110" width="30" height="300" rx="6" fill="#7F1D1D"/>
  <rect x="120" y="110" width="30" height="300" rx="6" fill="url(#pen45)" opacity="0.3"/>
  <!-- Gold emboss line on binding -->
  <line x1="135" y1="125" x2="135" y2="395" stroke="#FBBF24" stroke-width="1.5" opacity="0.6"/>
  <!-- Page texture lines -->
  <line x1="170" y1="175" x2="320" y2="175" stroke="#C7D2FE" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="210" x2="320" y2="210" stroke="#C7D2FE" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="245" x2="320" y2="245" stroke="#C7D2FE" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="280" x2="320" y2="280" stroke="#C7D2FE" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="315" x2="320" y2="315" stroke="#C7D2FE" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="350" x2="320" y2="350" stroke="#C7D2FE" stroke-width="2" opacity="0.6"/>
  <!-- Written entries — ink style -->
  <text x="178" y="205" font-family="system-ui" font-size="16" fill="#312E81" font-weight="500">दूध ५ लि.</text>
  <text x="280" y="205" font-family="system-ui" font-size="16" fill="#4F46E5" font-weight="700">₹250</text>
  <text x="178" y="240" font-family="system-ui" font-size="16" fill="#312E81" font-weight="500">दूध ३ लि.</text>
  <text x="280" y="240" font-family="system-ui" font-size="16" fill="#4F46E5" font-weight="700">₹150</text>
  <text x="178" y="275" font-family="system-ui" font-size="16" fill="#312E81" font-weight="500" opacity="0.6">दूध ४ लि.</text>
  <text x="280" y="275" font-family="system-ui" font-size="16" fill="#4F46E5" font-weight="700" opacity="0.6">₹200</text>
  <!-- 3D Fountain pen — with gold details -->
  <g filter="url(#glow45)" transform="rotate(-40 380 180)">
    <!-- Pen body -->
    <rect x="355" y="100" width="16" height="220" rx="8" fill="url(#pen45)"/>
    <!-- Pen grip section -->
    <rect x="353" y="280" width="20" height="50" rx="6" fill="#1E293B"/>
    <!-- Pen nib -->
    <path d="M363 330 L357 365 L363 370 L369 365 Z" fill="#D4AF37"/>
    <!-- Nib split -->
    <line x1="363" y1="340" x2="363" y2="368" stroke="#92400E" stroke-width="1"/>
    <!-- Clip -->
    <rect x="369" y="110" width="4" height="80" rx="2" fill="#D4AF37"/>
    <!-- Shine on pen -->
    <rect x="358" y="120" width="3" height="100" rx="2" fill="white" opacity="0.3"/>
  </g>
  <!-- Ink drops near writing -->
  <circle cx="305" cy="285" r="3" fill="#4F46E5" opacity="0.4"/>
  <circle cx="295" cy="292" r="2" fill="#4F46E5" opacity="0.3"/>
</svg>
