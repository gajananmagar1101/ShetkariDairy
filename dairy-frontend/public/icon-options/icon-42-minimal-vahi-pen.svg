<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#F8FAFC"/>
  <!-- Ultra clean white/light design -->
  <!-- Vahi — rounded rectangle -->
  <rect x="135" y="110" width="195" height="292" rx="16" fill="white" stroke="#E2E8F0" stroke-width="3"/>
  <!-- Binding holes -->
  <circle cx="155" cy="170" r="6" fill="#E2E8F0"/>
  <circle cx="155" cy="230" r="6" fill="#E2E8F0"/>
  <circle cx="155" cy="290" r="6" fill="#E2E8F0"/>
  <circle cx="155" cy="350" r="6" fill="#E2E8F0"/>
  <!-- Lines -->
  <line x1="175" y1="175" x2="310" y2="175" stroke="#F1F5F9" stroke-width="2"/>
  <line x1="175" y1="215" x2="310" y2="215" stroke="#F1F5F9" stroke-width="2"/>
  <line x1="175" y1="255" x2="310" y2="255" stroke="#F1F5F9" stroke-width="2"/>
  <line x1="175" y1="295" x2="310" y2="295" stroke="#F1F5F9" stroke-width="2"/>
  <line x1="175" y1="335" x2="310" y2="335" stroke="#F1F5F9" stroke-width="2"/>
  <!-- Written hishob -->
  <text x="190" y="210" font-family="system-ui" font-size="15" fill="#64748B">5 × ₹50 = 250</text>
  <text x="190" y="250" font-family="system-ui" font-size="15" fill="#64748B">3 × ₹50 = 150</text>
  <text x="190" y="290" font-family="system-ui" font-size="15" fill="#4F46E5" font-weight="600">एकूण ₹400</text>
  <!-- Pen — sleek modern pen at angle -->
  <rect x="310" y="130" width="10" height="200" rx="5" fill="#4F46E5" transform="rotate(25 315 230)"/>
  <polygon points="330,330 335,345 340,330" fill="#1E293B" transform="rotate(25 335 337)"/>
  <rect x="310" y="120" width="10" height="20" rx="5" fill="#818CF8" transform="rotate(25 315 130)"/>
</svg>
