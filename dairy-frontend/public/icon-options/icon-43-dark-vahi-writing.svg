<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#1E1B4B"/>
  <!-- Dark premium feel — vahi with glowing pen -->
  <!-- Notebook -->
  <rect x="130" y="115" width="210" height="300" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <!-- Page inside -->
  <rect x="145" y="130" width="180" height="270" rx="6" fill="#0F172A"/>
  <!-- Glowing lines being written -->
  <line x1="165" y1="180" x2="295" y2="180" stroke="#6366F1" stroke-width="2" opacity="0.3"/>
  <line x1="165" y1="215" x2="295" y2="215" stroke="#6366F1" stroke-width="2" opacity="0.3"/>
  <line x1="165" y1="250" x2="295" y2="250" stroke="#6366F1" stroke-width="2" opacity="0.3"/>
  <line x1="165" y1="285" x2="295" y2="285" stroke="#6366F1" stroke-width="2" opacity="0.3"/>
  <line x1="165" y1="320" x2="295" y2="320" stroke="#6366F1" stroke-width="2" opacity="0.3"/>
  <!-- Glowing written numbers -->
  <text x="175" y="210" font-family="system-ui" font-size="16" fill="#A5B4FC" opacity="0.9">₹ 450</text>
  <text x="175" y="245" font-family="system-ui" font-size="16" fill="#A5B4FC" opacity="0.7">₹ 320</text>
  <text x="175" y="280" font-family="system-ui" font-size="16" fill="#A5B4FC" opacity="0.5">₹ 180</text>
  <!-- Pen — glowing tip -->
  <line x1="360" y1="110" x2="280" y2="320" stroke="#F59E0B" stroke-width="9" stroke-linecap="round"/>
  <!-- Glow at pen tip -->
  <circle cx="280" cy="320" r="12" fill="#FBBF24" opacity="0.4"/>
  <circle cx="280" cy="320" r="5" fill="#FBBF24"/>
</svg>
