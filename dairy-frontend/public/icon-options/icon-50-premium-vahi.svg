<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg50" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C0A1D"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0C0A1D"/>
    </linearGradient>
    <linearGradient id="gold50" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="cover50" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="glow50">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="deep50">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg50)"/>
  <!-- Ambient golden glow -->
  <ellipse cx="256" cy="260" rx="160" ry="160" fill="#FBBF24" opacity="0.04"/>
  <!-- Vahi — premium leather look -->
  <rect x="125" y="105" width="230" height="310" rx="14" fill="url(#cover50)" filter="url(#deep50)"/>
  <!-- Gold border frame -->
  <rect x="135" y="115" width="210" height="290" rx="10" fill="none" stroke="url(#gold50)" stroke-width="2.5"/>
  <!-- Inner page -->
  <rect x="145" y="125" width="190" height="270" rx="8" fill="#FAF5FF" opacity="0.95"/>
  <!-- Gold corner decorations -->
  <path d="M145 125 L175 125 L145 155 Z" fill="url(#gold50)" opacity="0.6"/>
  <path d="M335 125 L305 125 L335 155 Z" fill="url(#gold50)" opacity="0.6"/>
  <path d="M145 395 L175 395 L145 365 Z" fill="url(#gold50)" opacity="0.6"/>
  <path d="M335 395 L305 395 L335 365 Z" fill="url(#gold50)" opacity="0.6"/>
  <!-- Ruled lines -->
  <line x1="165" y1="175" x2="315" y2="175" stroke="#DDD6FE" stroke-width="1.5"/>
  <line x1="165" y1="210" x2="315" y2="210" stroke="#DDD6FE" stroke-width="1.5"/>
  <line x1="165" y1="245" x2="315" y2="245" stroke="#DDD6FE" stroke-width="1.5"/>
  <line x1="165" y1="280" x2="315" y2="280" stroke="#DDD6FE" stroke-width="1.5"/>
  <line x1="165" y1="315" x2="315" y2="315" stroke="#DDD6FE" stroke-width="1.5"/>
  <line x1="165" y1="350" x2="315" y2="350" stroke="#DDD6FE" stroke-width="1.5"/>
  <!-- Ink entries -->
  <text x="175" y="205" font-family="system-ui" font-size="15" fill="#312E81" font-weight="600">दूध ५ लि.    ₹250</text>
  <text x="175" y="240" font-family="system-ui" font-size="15" fill="#312E81" font-weight="600">दूध ३ लि.    ₹150</text>
  <text x="175" y="275" font-family="system-ui" font-size="15" fill="#312E81" font-weight="600">दूध ४ लि.    ₹200</text>
  <!-- Underline total -->
  <line x1="165" y1="295" x2="315" y2="295" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="175" y="315" font-family="system-ui" font-size="15" fill="#4F46E5" font-weight="800">एकूण          ₹600</text>
  <!-- Premium fountain pen — gold and black -->
  <g transform="rotate(-38 400 150)" filter="url(#glow50)">
    <!-- Cap -->
    <rect x="380" y="50" width="18" height="70" rx="9" fill="#1E293B"/>
    <rect x="396" y="55" width="5" height="50" rx="2" fill="url(#gold50)"/>
    <!-- Ring -->
    <rect x="378" y="118" width="22" height="8" rx="4" fill="url(#gold50)"/>
    <!-- Body -->
    <rect x="380" y="126" width="18" height="160" rx="9" fill="url(#gold50)"/>
    <!-- Grip -->
    <rect x="380" y="286" width="18" height="40" rx="5" fill="#374151"/>
    <!-- Nib -->
    <path d="M389 326 L383 358 L389 363 L395 358 Z" fill="url(#gold50)"/>
    <line x1="389" y1="330" x2="389" y2="360" stroke="#92400E" stroke-width="1"/>
    <!-- Shine -->
    <rect x="384" y="140" width="3" height="80" rx="2" fill="white" opacity="0.35"/>
  </g>
</svg>
