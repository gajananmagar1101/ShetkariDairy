<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#1E1B4B"/>
  <!-- Classic ledger/vahi — closed book with binding -->
  <!-- Book body -->
  <rect x="140" y="100" width="240" height="320" rx="10" fill="#F8FAFC"/>
  <!-- Red binding stripe (classic vahi style) -->
  <rect x="140" y="100" width="35" height="320" rx="6" fill="#DC2626"/>
  <!-- Gold/yellow edge line -->
  <line x1="175" y1="100" x2="175" y2="420" stroke="#F59E0B" stroke-width="3"/>
  <!-- Horizontal ruling lines -->
  <line x1="195" y1="160" x2="355" y2="160" stroke="#E2E8F0" stroke-width="3"/>
  <line x1="195" y1="200" x2="355" y2="200" stroke="#E2E8F0" stroke-width="3"/>
  <line x1="195" y1="240" x2="355" y2="240" stroke="#E2E8F0" stroke-width="3"/>
  <line x1="195" y1="280" x2="355" y2="280" stroke="#E2E8F0" stroke-width="3"/>
  <line x1="195" y1="320" x2="355" y2="320" stroke="#E2E8F0" stroke-width="3"/>
  <line x1="195" y1="360" x2="355" y2="360" stroke="#E2E8F0" stroke-width="3"/>
  <!-- Vertical column line (like ledger) -->
  <line x1="280" y1="140" x2="280" y2="400" stroke="#CBD5E1" stroke-width="2"/>
  <!-- "श" watermark -->
  <text x="280" y="310" font-family="system-ui" font-size="120" font-weight="700" fill="#4F46E5" text-anchor="middle" opacity="0.08">श</text>
</svg>
