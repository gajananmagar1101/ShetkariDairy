<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Sky blue background -->
    <linearGradient id="bg49" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <!-- Page paper -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>
    <!-- Binding -->
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <!-- Pen metallic -->
    <linearGradient id="penMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="55%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <!-- Gold -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <!-- Cap reflection -->
    <radialGradient id="capReflect" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>
    <!-- Page edge -->
    <linearGradient id="pageEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="50%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <filter id="pageShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.12"/>
    </filter>
    <filter id="penShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg49)"/>

  <!-- ===== LAYERED PAGES ===== -->
  <rect x="175" y="132" width="220" height="300" rx="8" fill="#D1D5DB" opacity="0.4" transform="rotate(5 285 282)"/>
  <rect x="175" y="410" width="220" height="4" rx="2" fill="url(#pageEdge)" opacity="0.3" transform="rotate(5 285 412)"/>

  <rect x="168" y="125" width="220" height="300" rx="9" fill="#E2E8F0" opacity="0.6" transform="rotate(3 278 275)"/>
  <rect x="168" y="403" width="220" height="4" rx="2" fill="url(#pageEdge)" opacity="0.4" transform="rotate(3 278 405)"/>

  <rect x="160" y="118" width="220" height="300" rx="10" fill="#EDF0F4" opacity="0.8" transform="rotate(1.2 270 268)"/>
  <rect x="160" y="396" width="220" height="5" rx="2.5" fill="url(#pageEdge)" opacity="0.5" transform="rotate(1.2 270 398)"/>

  <rect x="152" y="112" width="220" height="300" rx="11" fill="#F3F4F6" opacity="0.9" transform="rotate(0.4 262 262)"/>
  <rect x="152" y="390" width="220" height="5" rx="3" fill="url(#pageEdge)" opacity="0.6" transform="rotate(0.4 262 393)"/>

  <!-- ===== MAIN PAGE ===== -->
  <rect x="144" y="106" width="220" height="300" rx="12" fill="url(#paper)" filter="url(#pageShadow)"/>

  <!-- Page curl bottom right -->
  <path d="M344 386 L364 386 L364 406 L344 406 Q354 398 352 390 Z" fill="#F1F5F9" opacity="0.6"/>
  <path d="M352 390 L364 386 L364 396 Z" fill="#E2E8F0" opacity="0.5"/>

  <!-- ===== BINDING ===== -->
  <rect x="144" y="106" width="32" height="300" rx="8" fill="url(#leather)"/>
  <line x1="150" y1="118" x2="150" y2="394" stroke="#991B1B" stroke-width="0.5" opacity="0.4"/>
  <line x1="160" y1="116" x2="160" y2="396" stroke="#FBBF24" stroke-width="1.5" opacity="0.45"/>
  <!-- Stitching -->
  <circle cx="148" cy="140" r="1.2" fill="#FDE68A" opacity="0.5"/>
  <circle cx="148" cy="170" r="1.2" fill="#FDE68A" opacity="0.5"/>
  <circle cx="148" cy="200" r="1.2" fill="#FDE68A" opacity="0.5"/>
  <circle cx="148" cy="230" r="1.2" fill="#FDE68A" opacity="0.5"/>
  <circle cx="148" cy="260" r="1.2" fill="#FDE68A" opacity="0.5"/>
  <circle cx="148" cy="290" r="1.2" fill="#FDE68A" opacity="0.5"/>
  <circle cx="148" cy="320" r="1.2" fill="#FDE68A" opacity="0.5"/>
  <circle cx="148" cy="350" r="1.2" fill="#FDE68A" opacity="0.5"/>
  <circle cx="148" cy="380" r="1.2" fill="#FDE68A" opacity="0.5"/>

  <!-- ===== GOLD CORNERS ===== -->
  <path d="M340 106 L364 106 L364 130 Z" fill="url(#gold)" opacity="0.35"/>
  <path d="M340 406 L364 406 L364 382 Z" fill="url(#gold)" opacity="0.25"/>

  <!-- ===== TITLE ===== -->
  <text x="255" y="153" font-family="system-ui" font-size="26" fill="#1E1B4B" font-weight="900" text-anchor="middle" letter-spacing="0.5">शेतकरी वही</text>
  <line x1="192" y1="165" x2="318" y2="165" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="218" y1="173" x2="292" y2="173" stroke="#4F46E5" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>

  <!-- ===== RULED LINES ===== -->
  <line x1="195" y1="185" x2="195" y2="390" stroke="#FCA5A5" stroke-width="0.8" opacity="0.4"/>
  <line x1="185" y1="200" x2="348" y2="200" stroke="#BFDBFE" stroke-width="1.2" opacity="0.5"/>
  <line x1="185" y1="232" x2="348" y2="232" stroke="#BFDBFE" stroke-width="1.2" opacity="0.5"/>
  <line x1="185" y1="264" x2="348" y2="264" stroke="#BFDBFE" stroke-width="1.2" opacity="0.5"/>
  <line x1="185" y1="296" x2="348" y2="296" stroke="#BFDBFE" stroke-width="1.2" opacity="0.5"/>
  <line x1="185" y1="328" x2="348" y2="328" stroke="#BFDBFE" stroke-width="1.2" opacity="0.5"/>
  <line x1="185" y1="360" x2="348" y2="360" stroke="#BFDBFE" stroke-width="1.2" opacity="0.5"/>

  <!-- ===== PEN — closed, realistic ===== -->
  <g transform="rotate(7 120 305)" filter="url(#penShadow)">
    <!-- Full body -->
    <rect x="111" y="148" width="18" height="240" rx="9" fill="url(#penMetal)"/>

    <!-- Cap dome -->
    <ellipse cx="120" cy="148" rx="9" ry="6" fill="url(#capReflect)"/>
    <circle cx="120" cy="146" r="3" fill="#334155"/>
    <circle cx="119" cy="145" r="1.2" fill="#64748B" opacity="0.7"/>

    <!-- Clip -->
    <rect x="127" y="152" width="5" height="65" rx="2.5" fill="url(#gold)"/>
    <ellipse cx="129.5" cy="217" rx="4" ry="4" fill="url(#gold)"/>

    <!-- Upper ring -->
    <rect x="109" y="225" width="22" height="4" rx="2" fill="url(#gold)"/>
    <!-- Seam -->
    <rect x="109" y="229" width="22" height="3" rx="1.5" fill="#1E293B"/>
    <!-- Band -->
    <rect x="109" y="232" width="22" height="8" rx="4" fill="url(#gold)"/>

    <!-- Body -->
    <rect x="111" y="240" width="18" height="110" rx="9" fill="url(#penMetal)"/>

    <!-- Grip rings -->
    <line x1="111" y1="280" x2="129" y2="280" stroke="#64748B" stroke-width="0.5" opacity="0.3"/>
    <line x1="111" y1="290" x2="129" y2="290" stroke="#64748B" stroke-width="0.5" opacity="0.3"/>
    <line x1="111" y1="300" x2="129" y2="300" stroke="#64748B" stroke-width="0.5" opacity="0.3"/>
    <line x1="111" y1="310" x2="129" y2="310" stroke="#64748B" stroke-width="0.5" opacity="0.3"/>
    <line x1="111" y1="320" x2="129" y2="320" stroke="#64748B" stroke-width="0.5" opacity="0.3"/>
    <line x1="111" y1="330" x2="129" y2="330" stroke="#64748B" stroke-width="0.5" opacity="0.3"/>

    <!-- Lower ring -->
    <rect x="109" y="348" width="22" height="5" rx="2.5" fill="url(#gold)"/>

    <!-- End piece -->
    <rect x="111" y="353" width="18" height="30" rx="9" fill="url(#penMetal)"/>

    <!-- Bottom dome -->
    <ellipse cx="120" cy="383" rx="9" ry="5.5" fill="#1E293B"/>
    <ellipse cx="120" cy="382" rx="5" ry="3" fill="#334155"/>
    <circle cx="120" cy="384" r="2" fill="url(#gold)" opacity="0.5"/>

    <!-- Highlights -->
    <rect x="114" y="155" width="3.5" height="90" rx="2" fill="white" opacity="0.15"/>
    <rect x="114" y="250" width="3.5" height="70" rx="2" fill="white" opacity="0.1"/>
    <rect x="124" y="160" width="1.5" height="60" rx="1" fill="white" opacity="0.07"/>
  </g>
</svg>
