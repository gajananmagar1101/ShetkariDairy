<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg47" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="top47" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="side47" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg47)"/>
  <!-- Isometric 3D vahi book -->
  <!-- Bottom shadow -->
  <ellipse cx="256" cy="400" rx="140" ry="25" fill="#6366F1" opacity="0.15"/>
  <!-- Book side (pages thickness) -->
  <path d="M130 310 L130 330 L310 380 L310 360 Z" fill="url(#side47)"/>
  <!-- Book front cover -->
  <path d="M310 130 L310 360 L380 330 L380 100 Z" fill="#7F1D1D"/>
  <!-- Book front cover gold border -->
  <path d="M315 135 L315 355 L375 325 L375 105 Z" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0.5"/>
  <!-- Book top surface (main page) -->
  <path d="M130 100 L130 310 L310 360 L310 130 Z" fill="url(#top47)"/>
  <!-- Lines on top page -->
  <line x1="160" y1="160" x2="285" y2="195" stroke="#C7D2FE" stroke-width="2"/>
  <line x1="160" y1="190" x2="285" y2="225" stroke="#C7D2FE" stroke-width="2"/>
  <line x1="160" y1="220" x2="285" y2="255" stroke="#C7D2FE" stroke-width="2"/>
  <line x1="160" y1="250" x2="285" y2="285" stroke="#C7D2FE" stroke-width="2"/>
  <line x1="160" y1="280" x2="285" y2="315" stroke="#C7D2FE" stroke-width="2"/>
  <!-- Written entries on isometric page -->
  <text x="170" y="185" font-family="system-ui" font-size="13" fill="#312E81" font-weight="600" transform="skewY(10)">₹ 450</text>
  <text x="170" y="215" font-family="system-ui" font-size="13" fill="#312E81" font-weight="600" transform="skewY(10)">₹ 320</text>
  <text x="170" y="245" font-family="system-ui" font-size="13" fill="#312E81" font-weight="600" transform="skewY(10)">₹ 180</text>
  <!-- 3D Pen floating above -->
  <g transform="rotate(-25 350 180)">
    <!-- Pen shadow -->
    <ellipse cx="360" cy="350" rx="8" ry="50" fill="#000" opacity="0.2"/>
    <!-- Pen body -->
    <rect x="345" y="80" width="14" height="190" rx="7" fill="#FBBF24"/>
    <!-- Pen metallic band -->
    <rect x="343" y="240" width="18" height="12" rx="3" fill="#D4AF37"/>
    <!-- Pen grip -->
    <rect x="345" y="252" width="14" height="40" rx="4" fill="#1E293B"/>
    <!-- Nib -->
    <path d="M352 292 L347 318 L352 322 L357 318 Z" fill="#D4AF37"/>
    <!-- Shine -->
    <rect x="348" y="100" width="3" height="80" rx="2" fill="white" opacity="0.4"/>
  </g>
  <!-- Floating ink particles -->
  <circle cx="280" cy="300" r="4" fill="#6366F1" opacity="0.6"/>
  <circle cx="265" cy="320" r="3" fill="#6366F1" opacity="0.4"/>
  <circle cx="290" cy="310" r="2" fill="#6366F1" opacity="0.5"/>
</svg>
