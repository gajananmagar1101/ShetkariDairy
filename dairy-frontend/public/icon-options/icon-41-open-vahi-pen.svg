<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g41" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g41)"/>
  <!-- Open book/vahi — two pages spread -->
  <path d="M256 140 L130 160 L130 395 L256 380 Z" fill="white" opacity="0.9"/>
  <path d="M256 140 L382 160 L382 395 L256 380 Z" fill="#F8FAFC" opacity="0.95"/>
  <!-- Center spine shadow -->
  <line x1="256" y1="140" x2="256" y2="380" stroke="#C7D2FE" stroke-width="3"/>
  <!-- Lines on right page (active writing side) -->
  <line x1="275" y1="195" x2="360" y2="195" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="275" y1="225" x2="360" y2="225" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="275" y1="255" x2="360" y2="255" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="275" y1="285" x2="360" y2="285" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="275" y1="315" x2="360" y2="315" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Written entries on right page -->
  <text x="280" y="220" font-family="system-ui" font-size="13" fill="#475569">रामू    ₹320</text>
  <text x="280" y="250" font-family="system-ui" font-size="13" fill="#475569">शामू   ₹450</text>
  <text x="280" y="280" font-family="system-ui" font-size="13" fill="#475569">गणा     ₹280</text>
  <!-- Left page — older entries (faded) -->
  <line x1="150" y1="200" x2="235" y2="200" stroke="#C7D2FE" stroke-width="2" opacity="0.5"/>
  <line x1="150" y1="230" x2="235" y2="230" stroke="#C7D2FE" stroke-width="2" opacity="0.5"/>
  <line x1="150" y1="260" x2="235" y2="260" stroke="#C7D2FE" stroke-width="2" opacity="0.5"/>
  <!-- Pen writing on right page — diagonal from top-right -->
  <line x1="370" y1="120" x2="310" y2="305" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
  <polygon points="306,305 310,320 314,305" fill="#1E293B"/>
</svg>
