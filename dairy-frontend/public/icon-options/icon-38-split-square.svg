  <rect x="130" y="130" width="120" height="252" rx="8" fill="white" opacity="0.92"/>
  <!-- Right half: rounded drop shape -->
  <path d="M310 130 C310 130 262 220 262 280 C262 340 280 382 310 382 C340 382 380 340 380 280 C380 220 310 130 310 130Z" fill="white" opacity="0.92"/>
